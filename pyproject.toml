[project]
name = "long-audio-aligner"
version = "0.1.0"
description = "Long audio alignment pipeline using VAD, ASR (Qwen3), and FA with FastAPI Server"
requires-python = ">=3.9"

# 基础必须依赖 (业务逻辑强相关 + Web服务强相关)
dependencies = [
    "soundfile>=0.12.1",
    "zhconv>=1.4.3",
    "Levenshtein>=0.25.1",       # 底层为 C 的高性能比对引擎
    "python-dotenv>=1.0.1",      # 用于自动加载 .env 环境变量
    "psutil>=5.0.0",             # 动态内存监控与探针
    "transformers>=4.40.0",      # Qwen 模型基础依赖
    "accelerate>=0.30.0",        # 模型设备映射与加速
    "silero-vad>=5.1.0",         # [新增] 改用 pip 托管官方 VAD 库
    # Web 服务与 UI 依赖
    "fastapi>=0.100.0",          
    "uvicorn>=0.23.0",           
    "python-multipart>=0.0.6",   # 用于解析 OpenAI 的表单数据
    "gradio>=4.0.0",             # 可视化调试 UI
]

# 可选环境依赖 (通过 pip install -e ".[环境名]" 安装)
[project.optional-dependencies]
# 硬件平台
GPU = ["torch", "torchaudio"]
CPU = ["torch", "torchaudio"]

# 下载生态
hf = ["huggingface_hub[cli]"]    # 国外 hf 命令行
ms = ["modelscope"]              # 国内 ModelScope

[tool.uv]
package = false